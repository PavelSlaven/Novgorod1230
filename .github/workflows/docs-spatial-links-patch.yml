name: Correct active Spatial documentation links

on:
  push:
    branches:
      - docs/contract-index-and-auditor-2026-09-02
    paths:
      - .github/workflows/docs-spatial-links-patch.yml

permissions:
  contents: write

jobs:
  patch-spatial-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/contract-index-and-auditor-2026-09-02
          fetch-depth: 0

      - name: Replace migration links with active specializations
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("AGENTS.md")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "- read-only DB/graph architecture — `data/knowledge-source/corpus/DOCUMENTS/read_only_database_and_graph_architecture.md`;":
              "- active Spatial v3 read-only DB/graph architecture — `data/knowledge-source/corpus/DOCUMENTS/spatial_v3_target_read_only_database_and_graph_architecture.md`; прежний `read_only_database_and_graph_architecture.md` является migration/rollback source;",
              "- G0–G4 workflow — `data/knowledge-source/corpus/DOCUMENTS/map_g0_g4_workflow.txt`;":
              "- active G0–G5 authoring workflow — `data/knowledge-source/corpus/DOCUMENTS/spatial_v3_target_map_g0_g4_workflow.txt`; прежний `map_g0_g4_workflow.txt` является migration/rollback source;",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"unexpected marker count {count}: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          git diff --check
          grep -F "active Spatial v3 read-only DB/graph architecture" AGENTS.md
          grep -F "active G0–G5 authoring workflow" AGENTS.md

          git rm .github/workflows/docs-spatial-links-patch.yml
          git add AGENTS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: point AGENTS to active Spatial v3 contracts"
          git push origin HEAD:docs/contract-index-and-auditor-2026-09-02
