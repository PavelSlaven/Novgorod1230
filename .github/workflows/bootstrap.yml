name: Bootstrap project import

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v7

      - name: Download project archive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "