name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-clone-generation-test:
    name: full-npm-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
      PGPORT: 5432
      PGUSER: postgres
    steps:
      - name: Checkout clean clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Determine required check profile
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "profile=full" >> "$GITHUB_OUTPUT"
            echo "full"
          elif git show HEAD^:tools/spatial-v3/p28-ci-profile.mjs > "$RUNNER_TEMP/p28-ci-profile.mjs"; then
            node "$RUNNER_TEMP/p28-ci-profile.mjs"
          else
            echo "profile=full" >> "$GITHUB_OUTPUT"
            echo "full"
          fi

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize lockfile registry
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'package-lock.json';
          const privatePrefix = 'https://packages.applied-caas-gateway1.internal.api.openai.org/artifactory/api/npm/npm-public/';
          const publicPrefix = 'https://registry.npmjs.org/';
          const source = await readFile(path, 'utf8');
          const normalized = source.replaceAll(privatePrefix, publicPrefix);
          if (normalized.includes(privatePrefix)) {
            throw new Error('Private registry prefix remains in package-lock.json after normalization');
          }
          if (normalized !== source) await writeFile(path, normalized);
          NODE

      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npm ci

      - name: Apply PR91 knowledge routing fix and commit generated output
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/contract-index-and-auditor-2026-09-02'
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';

          const manifestPath = 'data/knowledge-source/corpus-manifest.json';
          const policyPath = 'data/knowledge-source/retrieval-policy.json';
          const testPath = 'packages/knowledge-source/test/rag-policy-repository.test.js';

          const manifestBytes = await readFile(manifestPath);
          const manifestSha = createHash('sha256').update(manifestBytes).digest('hex');
          const policy = JSON.parse(await readFile(policyPath, 'utf8'));
          policy.baseline_manifest_sha256 = manifestSha;

          if (!policy.documents.some((item) => item.document_id === 'contract-index')) {
            const record = {
              document_id: 'contract-index',
              document_type: 'navigation',
              priority_tier: 'navigation',
              subsystems: ['documentation', 'contracts', 'audit'],
              related_document_ids: [
                'llm-documentation-navigation',
                'code-critic-invocation-rule',
                'spatial-architecture-standard-g0-g6'
              ],
              related_module_paths: ['packages/knowledge-source'],
              related_contracts: ['canonical contract status and precedence routing'],
              search_terms: [
                'contract index',
                'document status',
                'precedence',
                'active contracts',
                'Contract Auditor'
              ],
              conflicts_with_document_ids: [],
              semantic_coverage_disposition: 'baseline_gap'
            };
            const after = policy.documents.findIndex((item) => item.document_id === 'documentation-corpus-readme');
            policy.documents.splice(after >= 0 ? after + 1 : policy.documents.length, 0, record);
          }

          const activeSpatial = new Map([
            ['spatial-v3-target-code-driven-world-materialization-architecture', ['packages/materialization', 'packages/space-map', 'infra/world-base']],
            ['spatial-v3-target-world-base-materialization-table-requirements', ['infra/world-base', 'packages/materialization', 'packages/space-map']],
            ['spatial-v3-target-read-only-database-and-graph-architecture', ['infra/world-base', 'packages/space-map']],
            ['spatial-v3-target-map-g0-g4-workflow', ['tools/map-maker', 'tools/world-catalog-workflow', 'packages/space-map']]
          ]);
          for (const [id, modulePaths] of activeSpatial) {
            const item = policy.documents.find((entry) => entry.document_id === id);
            if (!item) throw new Error(`Missing retrieval metadata for ${id}`);
            item.related_module_paths = modulePaths;
            item.related_contracts = ['active Spatial v3 production specialization'];
            item.search_terms = [
              'spatial v3 production',
              'versioned production activation cutover',
              'G0',
              'G6',
              'production specialization'
            ];
          }

          const navigationControl = policy.control_queries.find((item) => item.query_id === 'documentation-navigation');
          if (navigationControl) {
            navigationControl.query = 'какой документ определяет статус active proposed migration contract set и precedence';
            navigationControl.expected_document_ids = ['contract-index'];
          }
          const criticControl = policy.control_queries.find((item) => item.query_id === 'critic-required');
          if (criticControl) {
            criticControl.query = 'когда обязателен Contract Auditor независимый аудит и blocking finding';
            criticControl.expected_document_ids = ['contract-index', 'code-critic-invocation-rule'];
          }
          await writeFile(policyPath, `${JSON.stringify(policy, null, 2)}\n`);

          const source = await readFile(testPath, 'utf8');
          const start = source.indexOf("test('repository registers spatial v3 supplements as proposed and keeps default retrieval active-only'");
          const next = source.indexOf("test('repository registers the audited spatial architecture standard as an active target normative'", start);
          if (start < 0 || next < 0) throw new Error('Stale Spatial v3 repository test block was not found');
          const replacement = `test('repository registers active spatial v3 specializations and excludes deprecated v2 sources from default retrieval', async () => {
  const manifest = validateCorpusManifest(JSON.parse(await readFile(resolve(sourceRoot, 'corpus-manifest.json'), 'utf8')));
  const policy = validateRetrievalPolicy(JSON.parse(await readFile(resolve(sourceRoot, 'retrieval-policy.json'), 'utf8')), manifest);
  const activeV3Ids = [
    'spatial-v3-target-code-driven-world-materialization-architecture',
    'spatial-v3-target-world-base-materialization-table-requirements',
    'spatial-v3-target-read-only-database-and-graph-architecture',
    'spatial-v3-target-map-g0-g4-workflow'
  ];
  const deprecatedV2Ids = [
    'read-only-database-and-graph-architecture',
    'map-g0-g4-workflow'
  ];
  assert.deepEqual(
    manifest.documents.filter((document) => activeV3Ids.includes(document.document_id)).map((document) => document.status),
    ['active', 'active', 'active', 'active']
  );
  assert.deepEqual(
    manifest.documents.filter((document) => deprecatedV2Ids.includes(document.document_id)).map((document) => document.status),
    ['deprecated', 'deprecated']
  );
  assert.deepEqual(policy.default_statuses, ['active']);
  assert.equal(policy.documents.filter((document) => activeV3Ids.includes(document.document_id)).length, activeV3Ids.length);
  const indexMetadata = policy.documents.find((document) => document.document_id === 'contract-index');
  assert.equal(indexMetadata?.document_type, 'navigation');
  assert.equal(indexMetadata?.priority_tier, 'navigation');

  const reader = createKnowledgeRagReader({
    storage: createFileSystemKnowledgeSourceStorage({ sourceRoot, generatedRoot }),
    allowedStatuses: ['active', 'deprecated']
  });
  const defaultResult = await reader.searchKnowledge({ query: 'finite party-generated G5' });
  assert.ok(defaultResult.results.some((result) => activeV3Ids.includes(result.document_id)));
  assert.ok(defaultResult.results.every((result) => !deprecatedV2Ids.includes(result.document_id)));

  const deprecatedResult = await reader.searchKnowledge({ query: 'migration rollback G0 G4', statuses: ['deprecated'] });
  assert.ok(deprecatedResult.results.length > 0);
  assert.ok(deprecatedResult.results.every((result) => deprecatedV2Ids.includes(result.document_id)));
});

`;
          await writeFile(testPath, source.slice(0, start) + replacement + source.slice(next));
          NODE

          npm run docs:generate
          git show HEAD^:.github/workflows/test.yml > .github/workflows/test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/knowledge-source/retrieval-policy.json packages/knowledge-source/test/rag-policy-repository.test.js generated/ MODULE_INDEX.md infra/world-base/SCHEMA_REFERENCE.md .github/workflows/test.yml
          git diff --cached --check
          git commit -m "fix: synchronize PR91 knowledge retrieval cutover"
          git push origin HEAD:"$GITHUB_HEAD_REF"

      - name: Use Python 3.12 for world_base importer
        if: steps.profile.outputs.profile == 'full'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Graphify
        if: steps.profile.outputs.profile == 'full'
        run: |
          python -m pip install --user "graphifyy==0.9.17"
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          graphify --version

      - name: Validate tracked world_base source bundle
        if: steps.profile.outputs.profile == 'full'
        run: |
          python -m pip install -r tools/rus13-world-base-importer/requirements.txt
          export RUS13_BASE_INPUT_ROOT="$RUNNER_TEMP/rus13-base-staging"
          npm run world-db:prepare-staging
          npm run world-db:import:dry-run -- --report "$RUNNER_TEMP/world-base-import-dry-run.json"
          npm run world-db:fk-audit:staged -- --out-dir "$RUNNER_TEMP/world-base-fk-audit-staged"

      - name: Validate canonical world_base schema
        if: steps.profile.outputs.profile == 'full'
        run: |
          npm run world-db:schema-check
          npm run world-db:schema-doc-check

      - name: Start PostgreSQL for full profile
        if: steps.profile.outputs.profile == 'full'
        run: |
          docker run --detach --name spatial-v3-ci-postgres \
            --env POSTGRES_DB=postgres \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_USER=postgres \
            --publish 5432:5432 postgres:16

      - name: Execute world_base DDL in PostgreSQL
        if: steps.profile.outputs.profile == 'full'
        run: |
          ready=false
          for attempt in {1..30}; do
            if pg_isready --dbname postgres; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          createdb world_base_ci
          psql --dbname world_base_ci --set ON_ERROR_STOP=1 -f infra/world-base/schema.sql

          table_count=$(psql --dbname world_base_ci --tuples-only --no-align --command "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'world_base' AND table_type = 'BASE TABLE'")
          test "$table_count" -eq 201

          role_count=$(psql --dbname world_base_ci --tuples-only --no-align --command "SELECT count(*) FROM pg_roles WHERE rolname = 'world_reader' AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole")
          test "$role_count" -eq 1

          usage_grant=$(psql --dbname world_base_ci --tuples-only --no-align --command "SELECT has_schema_privilege('world_reader', 'world_base', 'USAGE')::int")
          create_grant=$(psql --dbname world_base_ci --tuples-only --no-align --command "SELECT has_schema_privilege('world_reader', 'world_base', 'CREATE')::int")
          test "$usage_grant" -eq 1
          test "$create_grant" -eq 0

          select_grants=$(psql --dbname world_base_ci --tuples-only --no-align --command "SELECT count(*) FROM information_schema.role_table_grants WHERE grantee = 'world_reader' AND table_schema = 'world_base' AND privilege_type = 'SELECT'")
          write_grants=$(psql --dbname world_base_ci --tuples-only --no-align --command "SELECT count(*) FROM information_schema.role_table_grants WHERE grantee = 'world_reader' AND table_schema = 'world_base' AND privilege_type <> 'SELECT'")
          test "$select_grants" -eq "$table_count"
          test "$write_grants" -eq 0

      - name: Execute Stage 3B-1 supplemental PostgreSQL integration
        if: steps.profile.outputs.profile == 'full'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/world_base_ci
        run: npm run world-db:import:stage3b1:integration

      - name: Execute character appearance runtime-catalog PostgreSQL integration
        if: steps.profile.outputs.profile == 'full'
        run: npm run character-appearance:test-world-v4-postgres

      - name: Validate canonical knowledge corpus
        if: steps.profile.outputs.profile == 'full'
        run: npm run knowledge:check-corpus

      - name: Generate deterministic documentation and knowledge artifacts
        if: steps.profile.outputs.profile == 'full'
        run: |
          set +e
          npm run docs:generate > "$RUNNER_TEMP/docs-generate.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/docs-generate.log"
          exit "$status"

      - name: Generate deterministic character appearance publication chain
        if: steps.profile.outputs.profile == 'full'
        run: npm run character-appearance:generate

      - name: Verify generated files are reproducible
        if: steps.profile.outputs.profile == 'full'
        run: |
          git diff --exit-code -- MODULE_INDEX.md generated/ infra/world-base/SCHEMA_REFERENCE.md data/world-catalogs/novgorod/lower-dvina-trace-v1/phase-m7-content/ data/world-catalogs/novgorod/lower-dvina-trace-v1/phase-1a-v15/ data/world-catalogs/novgorod/lower-dvina-trace-v1/phase-1b-v14/
          uncommitted=$(git status --porcelain --untracked-files=all -- MODULE_INDEX.md generated/ infra/world-base/SCHEMA_REFERENCE.md data/world-catalogs/novgorod/lower-dvina-trace-v1/phase-m7-content/ data/world-catalogs/novgorod/lower-dvina-trace-v1/phase-1a-v15/ data/world-catalogs/novgorod/lower-dvina-trace-v1/phase-1b-v14/)
          if [ -n "$uncommitted" ]; then
            printf '%s\n' "$uncommitted"
            exit 1
          fi

      - name: Build and verify Repository Graph for current HEAD
        if: steps.profile.outputs.profile == 'full'
        run: |
          npm run repo-intel:build
          npm run repo-intel:status
          npm run test:repository-intelligence

      - name: Run full npm test merge gate
        if: steps.profile.outputs.profile == 'full'
        run: |
          set +e
          npm test > "$RUNNER_TEMP/npm-test.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/npm-test.log"
          exit "$status"

      - name: Run evidence-only checks
        if: steps.profile.outputs.profile == 'evidence_only'
        run: |
          npm run spatial-v3:test-p28
          npm run spatial-v3:check-p28
          npm run spatial-v3:p28-local-evidence
          npm run docs:check

      - name: Upload generated evidence on failure
        if: failure() && steps.profile.outputs.profile == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: generated-and-test-evidence
          if-no-files-found: ignore
          path: |
            generated/
            MODULE_INDEX.md
            ${{ runner.temp }}/docs-generate.log
            ${{ runner.temp }}/npm-test.log

      - name: Stop PostgreSQL
        if: always() && steps.profile.outputs.profile == 'full'
        run: docker rm --force spatial-v3-ci-postgres || true