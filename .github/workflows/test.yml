name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-clone-generation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout clean clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize lockfile registry
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'package-lock.json';
          const privatePrefix = 'https://packages.applied-caas-gateway1.internal.api.openai.org/artifactory/api/npm/npm-public/';
          const publicPrefix = 'https://registry.npmjs.org/';
          const source = await readFile(path, 'utf8');
          const normalized = source.replaceAll(privatePrefix, publicPrefix);
          if (normalized === source) {
            throw new Error('Expected private registry prefix was not found in package-lock.json');
          }
          await writeFile(path, normalized);
          NODE

      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npm ci

      - name: Validate canonical world_base schema
        run: npm run world-db:schema-check

      - name: Validate canonical knowledge corpus
        run: npm run knowledge:check-corpus

      - name: Generate deterministic documentation and knowledge artifacts
        run: |
          mkdir -p artifacts/ci
          set +e
          npm run docs:generate > artifacts/ci/docs-generate.log 2>&1
          status=$?
          cat artifacts/ci/docs-generate.log
          exit "$status"

      - name: Verify generated files are reproducible
        run: git diff --exit-code -- MODULE_INDEX.md generated/

      - name: Run full test suite
        run: npm test

      - name: Upload generated evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-and-test-evidence
          if-no-files-found: ignore
          path: |
            generated/
            MODULE_INDEX.md
            artifacts/
