name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - run: npm run release:guard
      - run: npm run release:build
      - run: npm run release:zip
      - run: npm run release:verify
      - run: npm run docs:graph:verify
      - run: git diff --exit-code -- src test DOCUMENTS .github .gitignore package.json scripts
