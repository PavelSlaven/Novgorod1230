name: world-base

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-world_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-world_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-world_admin} -d ${POSTGRES_DB:-world_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nocodb:
    image: nocodb/nocodb:latest
    restart: unless-stopped
    ports:
      - "${NOCODB_PORT:-8080}:8080"
    environment:
      NC_DB: "pg://postgres:5432?u=${POSTGRES_USER:-world_admin}&p=${POSTGRES_PASSWORD}&d=${POSTGRES_DB:-world_db}"
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET:-change-me-in-production}
      # ponytail: dev-only — allow NocoDB → postgres service on Docker network
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"
    volumes:
      - nocodb_data:/usr/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  nocodb_data:
