name: Apply contract index links to AGENTS

on:
  push:
    branches:
      - docs/contract-index-and-auditor-2026-09-02
    paths:
      - .github/workflows/docs-contract-index-patch.yml

permissions:
  contents: write

jobs:
  patch-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/contract-index-and-auditor-2026-09-02
          fetch-depth: 0

      - name: Apply guarded AGENTS.md patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python <<'PYCODE'
          from pathlib import Path
          import base64

          path = Path("AGENTS.md")
          text = path.read_text(encoding="utf-8")

          bootstrap_marker = "Перед работой заново прочитай актуальный `AGENTS.md` из фактического checkout.\n"
          bootstrap_addition = (
              bootstrap_marker
              + "\nЗатем открой [канонический индекс контрактов]"
              + "(data/knowledge-source/corpus/DOCUMENTS/CONTRACT_INDEX.md), чтобы установить статусы документов, "
              + "applicable active contracts, precedence и обязательные триггеры Contract Auditor.\n"
          )
          if text.count(bootstrap_marker) != 1:
              raise SystemExit(f"unexpected bootstrap marker count: {text.count(bootstrap_marker)}")
          if "канонический индекс контрактов" not in text:
              text = text.replace(bootstrap_marker, bootstrap_addition, 1)

          old_navigation = (
              "Используй [навигацию по документации]"
              "(data/knowledge-source/corpus/DOCUMENTS/llm_documentation_navigation.md), "
              "чтобы выбрать профильный норматив."
          )
          new_navigation = (
              "Используй [канонический индекс контрактов]"
              "(data/knowledge-source/corpus/DOCUMENTS/CONTRACT_INDEX.md), чтобы определить статус документа, "
              "applicable contract set и precedence. `llm_documentation_navigation.md` сохранён только как compatibility redirect."
          )
          if text.count(old_navigation) != 1:
              raise SystemExit(f"unexpected navigation marker count: {text.count(old_navigation)}")
          text = text.replace(old_navigation, new_navigation, 1)

          audit_marker = "Для обычного локального исправления отдельный critic не нужен.\n\n"
          audit_section = base64.b64decode("").decode("utf-8")
          if "### 25.1. Contract Auditor" not in text:
              if text.count(audit_marker) != 1:
                  raise SystemExit(f"unexpected audit marker count: {text.count(audit_marker)}")
              text = text.replace(audit_marker, audit_section, 1)

          required = [
              "data/knowledge-source/corpus/DOCUMENTS/CONTRACT_INDEX.md",
              "### 25.1. Contract Auditor",
              "verdict: PASS | PASS_WITH_NOTES | BLOCK",
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f"missing required text: {needle}")

          path.write_text(text, encoding="utf-8", newline="\n")
          PYCODE

          git diff --check
          grep -F "CONTRACT_INDEX.md" AGENTS.md
          grep -F "### 25.1. Contract Auditor" AGENTS.md

          git rm .github/workflows/docs-contract-index-patch.yml
          git add AGENTS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: link contract index and define Contract Auditor"
          git push origin HEAD:docs/contract-index-and-auditor-2026-09-02
