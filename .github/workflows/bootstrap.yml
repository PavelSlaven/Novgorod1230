name: Bootstrap project import

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4

      - name: Download project archive
        run: |
          python -m pip install --disable-pip-version-check gdown
          gdown --id 1oN2IUSlQW_Jm9PpNDbNvV2Gdvgg-auWq --output project.zip
          test -s project.zip

      - name: Extract cleaned project
        run: |
          rm -rf import-root
          mkdir import-root
          unzip -q project.zip -d import-root
          test -d import-root/Rus_modules_project

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name import-root \
            ! -name project.zip \
            -exec rm -rf {} +

          cp -a import-root/Rus_modules_project/. .

          rm -rf artifacts generated legacy/data
          mkdir -p artifacts generated
          : > artifacts/.gitkeep
          : > generated/.gitkeep
          rm -f CHECKSUMS.sha256 FILES.sha256
          rm -rf import-root project.zip

      - name: Validate project
        run: |
          npm ci --ignore-scripts
          npm run knowledge:generate
          npm run docs:generate
          npm test
          npm run release:check

      - name: Remove generated and dependency output
        run: |
          rm -rf node_modules
          rm -rf artifacts generated
          mkdir -p artifacts generated
          : > artifacts/.gitkeep
          : > generated/.gitkeep
          rm -rf .github/workflows/bootstrap.yml

      - name: Commit imported project
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Import Rus_modules 0.23.0"
          git push origin HEAD:main
