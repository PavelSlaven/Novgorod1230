name: Correct contract index audit pin

on:
  push:
    branches:
      - docs/contract-index-and-auditor-2026-09-02
    paths:
      - .github/workflows/docs-index-pin-patch.yml

permissions:
  contents: write

jobs:
  patch-index-pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/contract-index-and-auditor-2026-09-02
          fetch-depth: 0

      - name: Replace tree SHA with main commit SHA
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("data/knowledge-source/corpus/DOCUMENTS/CONTRACT_INDEX.md")
          text = path.read_text(encoding="utf-8")
          old = "`main` HEAD `3978d19460a8609afecac700b796d8fcfabf6288`"
          new = "`main` HEAD `4cb58cdd1ee1ef636dfdf0437b650bffe50f0936`"
          if text.count(old) != 1:
              raise SystemExit(f"unexpected old pin count: {text.count(old)}")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          git diff --check
          grep -F 'main` HEAD `4cb58cdd1ee1ef636dfdf0437b650bffe50f0936' data/knowledge-source/corpus/DOCUMENTS/CONTRACT_INDEX.md

          git rm .github/workflows/docs-index-pin-patch.yml
          git add data/knowledge-source/corpus/DOCUMENTS/CONTRACT_INDEX.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: pin contract audit to main commit"
          git push origin HEAD:docs/contract-index-and-auditor-2026-09-02
