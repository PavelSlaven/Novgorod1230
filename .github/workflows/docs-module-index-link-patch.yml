name: Link module contract index

on:
  push:
    branches:
      - docs/contract-index-and-auditor-2026-09-02
    paths:
      - .github/workflows/docs-module-index-link-patch.yml

permissions:
  contents: write

jobs:
  patch-module-index-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/contract-index-and-auditor-2026-09-02
          fetch-depth: 0

      - name: Add module contract navigation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("data/knowledge-source/corpus/DOCUMENTS/CONTRACT_INDEX.md")
          text = path.read_text(encoding="utf-8")
          marker = "`Novgorod1230_project_instruction_full.md` отсутствует в repository `main`. Его устойчивое содержание уже включено в root `AGENTS.md`; создавать параллельную копию не следует. Внешняя копия с таким именем может быть только входным материалом для сравнения и не переопределяет GitHub.\n\n"
          addition = marker + "## 3.1. Module contracts and public schemas\n\nВсе module-level contracts перечислены в generated [`MODULE_INDEX.md`](../../../../MODULE_INDEX.md). Этот generated файл используется только для навигации; точный owner и public boundary задаёт соответствующий `MODULE.md`, а physical schema — canonical DDL/schema source затронутой области.\n\nContract Auditor не копирует весь generated module index сюда и не редактирует его вручную. Он выбирает relevant `MODULE.md` по `MODULE_INDEX.md`, затем сверяет public exports, schemas, callers и tests.\n\n"
          if "## 3.1. Module contracts and public schemas" not in text:
              if text.count(marker) != 1:
                  raise SystemExit(f"unexpected marker count: {text.count(marker)}")
              text = text.replace(marker, addition, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          git diff --check
          grep -F "MODULE_INDEX.md" data/knowledge-source/corpus/DOCUMENTS/CONTRACT_INDEX.md

          git rm .github/workflows/docs-module-index-link-patch.yml
          git add data/knowledge-source/corpus/DOCUMENTS/CONTRACT_INDEX.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: link module contract index"
          git push origin HEAD:docs/contract-index-and-auditor-2026-09-02
